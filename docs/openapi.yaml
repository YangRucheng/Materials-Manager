components:
  schemas:
    AiSearchExpandRead:
      properties:
        original:
          type: string
          title: Original
        expanded:
          type: string
          title: Expanded
      type: object
      required:
      - original
      - expanded
      title: AiSearchExpandRead
    AiSearchExpandRequest:
      properties:
        value:
          type: string
          maxLength: 500
          minLength: 1
          title: Value
      additionalProperties: false
      type: object
      required:
      - value
      title: AiSearchExpandRequest
    AiSearchSettingsRead:
      properties:
        endpoint:
          type: string
          title: Endpoint
        api_key:
          type: string
          title: Api Key
        model:
          type: string
          title: Model
        enabled:
          type: boolean
          title: Enabled
        mini_program_code_env:
          $ref: '#/components/schemas/MiniProgramCodeEnv'
        mini_program_code_app_id:
          type: string
          title: Mini Program Code App Id
        mini_program_app_ids:
          items:
            type: string
          type: array
          title: Mini Program App Ids
        mini_program_registration_enabled:
          type: boolean
          title: Mini Program Registration Enabled
        mini_program_new_user_enabled:
          type: boolean
          title: Mini Program New User Enabled
        image_acceleration_server_url:
          type: string
          title: Image Acceleration Server Url
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        version:
          type: integer
          title: Version
      type: object
      required:
      - endpoint
      - api_key
      - model
      - enabled
      - mini_program_code_env
      - mini_program_code_app_id
      - mini_program_app_ids
      - mini_program_registration_enabled
      - mini_program_new_user_enabled
      - image_acceleration_server_url
      - version
      title: AiSearchSettingsRead
    AiSearchSettingsUpdate:
      properties:
        endpoint:
          type: string
          maxLength: 500
          title: Endpoint
          default: ''
        api_key:
          type: string
          maxLength: 1000
          title: Api Key
          default: ''
        model:
          type: string
          maxLength: 128
          title: Model
          default: ''
        enabled:
          type: boolean
          title: Enabled
          default: true
        mini_program_code_env:
          $ref: '#/components/schemas/MiniProgramCodeEnv'
          default: release
        mini_program_code_app_id:
          type: string
          maxLength: 64
          title: Mini Program Code App Id
          default: ''
        mini_program_registration_enabled:
          type: boolean
          title: Mini Program Registration Enabled
          default: true
        mini_program_new_user_enabled:
          type: boolean
          title: Mini Program New User Enabled
          default: true
        image_acceleration_server_url:
          type: string
          maxLength: 500
          title: Image Acceleration Server Url
          default: ''
        version:
          type: integer
          minimum: 0.0
          title: Version
      additionalProperties: false
      type: object
      required:
      - version
      title: AiSearchSettingsUpdate
    AiSearchStatusRead:
      properties:
        available:
          type: boolean
          title: Available
      type: object
      required:
      - available
      title: AiSearchStatusRead
    AiSearchTestRead:
      properties:
        original:
          type: string
          title: Original
        expanded:
          type: string
          title: Expanded
      type: object
      required:
