name: 契约文件自动同步

# 在 PR 上重新生成标准 openapi.yaml 与前端类型，并自动提交回 PR 分支，
# 保证合并前的契约文件始终与后端/前端代码一致，便于下游对接。
on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/**"
      - "frontend/**"
      - ".github/workflows/sync-contract.yml"

permissions:
  contents: write

concurrency:
  group: sync-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: 同步 openapi 与前端类型
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 分支
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装后端依赖
        working-directory: backend
        run: pip install -e ".[dev]" || pip install -e .

      - name: 重新生成 openapi.yaml
        working-directory: backend
        run: python scripts/export_openapi.py

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 重新生成前端类型
        working-directory: frontend
        run: npm run generate:api

      - name: 提交契约文件变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.yaml frontend/src/api/generated.raw.ts
          if git diff --cached --quiet; then
            echo "契约文件无变化，无需提交"
          else
            git commit -m "chore: 自动同步 openapi 与前端类型"
            git push
          fi

      - name: 类型检查（generated.ts 引用映射是否仍成立）
        working-directory: frontend
        run: npx vue-tsc -b
