name: 自动上传微信小程序代码

on:
  push:
    branches: [main]
    paths:
      - "miniprogram/**"
      - ".github/workflows/upload-miniprogram.yml"
  workflow_dispatch:
    inputs:
      version:
        description: 上传版本号（留空则自动生成）
        required: false
        type: string
      description:
        description: 上传说明（留空则使用提交编号）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: miniprogram-upload
  cancel-in-progress: false

jobs:
  upload:
    name: 检查并上传小程序
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    env:
      MINIPROGRAM_APPID: ${{ secrets.WECHAT_MINIPROGRAM_APPID }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: 检查私密配置
        env:
          MINIPROGRAM_PRIVATE_KEY: ${{ secrets.WECHAT_MINIPROGRAM_PRIVATE_KEY }}
        run: |
          if [ -z "$MINIPROGRAM_APPID" ]; then
            echo "缺少 GitHub Secret：WECHAT_MINIPROGRAM_APPID"
            exit 1
          fi
          if [ -z "$MINIPROGRAM_PRIVATE_KEY" ]; then
            echo "缺少 GitHub Secret：WECHAT_MINIPROGRAM_PRIVATE_KEY"
            exit 1
          fi
          PRIVATE_KEY_PATH="$RUNNER_TEMP/miniprogram-private.key"
          printf '%s' "$MINIPROGRAM_PRIVATE_KEY" > "$PRIVATE_KEY_PATH"
          chmod 600 "$PRIVATE_KEY_PATH"
          echo "MINIPROGRAM_PRIVATE_KEY_PATH=$PRIVATE_KEY_PATH" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm ci

      - name: 检查小程序代码
        run: npm run check

      - name: 生成上传信息
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_DESCRIPTION: ${{ inputs.description }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "MINIPROGRAM_VERSION=${MANUAL_VERSION:-1.0.${GITHUB_RUN_NUMBER}}" >> "$GITHUB_ENV"
          echo "MINIPROGRAM_DESC=${MANUAL_DESCRIPTION:-自动上传 ${SHORT_SHA}}" >> "$GITHUB_ENV"

      - name: 上传微信小程序代码
        run: npm run upload

      - name: 清理上传私钥
        if: always()
        run: rm -f "$MINIPROGRAM_PRIVATE_KEY_PATH"
