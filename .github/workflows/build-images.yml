name: 构建 Docker 镜像

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "server/**"
      - "frontend/**"
      - ".github/workflows/build-images.yml"
  pull_request:
    paths:
      - "server/**"
      - "frontend/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: yangrucheng
  # 仅 手动触发 / push 到 main / push v* 标签 时才推送镜像到 Docker Hub；
  # pull_request 事件一律只做构建测试，绝不推送。
  SHOULD_PUSH_IMAGE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}

jobs:
  changes:
    name: 检测变更组件
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.set-components.outputs.components }}
    steps:
      - name: 检出代码（完整历史，供变更比对）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 检测后端/前端文件变更
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 只输出 true/false，不列出具体文件
          list-files: none
          filters: |
            backend:
              - 'server/**'
              - '.github/workflows/build-images.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/build-images.yml'

      - name: 汇总需要构建的组件
        id: set-components
        run: |
          # 手动触发时固定构建前后端两个组件
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'components=["backend","frontend"]' >> "$GITHUB_OUTPUT"
          else
            COMPONENTS="[]"
            if [ "${{ steps.filter.outputs.backend }}" = "true" ]; then
              COMPONENTS="$(printf '%s' "$COMPONENTS" | jq -c '. + ["backend"]')"
            fi
            if [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then
              COMPONENTS="$(printf '%s' "$COMPONENTS" | jq -c '. + ["frontend"]')"
            fi
            echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 构建 ${{ matrix.component }} 镜像
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 生成构建信息
        id: buildinfo
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 设置组件构建参数
        id: settings
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            echo "context=./server" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./server/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "build_args<<EOF" >> "$GITHUB_OUTPUT"
            echo "BUILD_TIME=${{ steps.buildinfo.outputs.build_time }}" >> "$GITHUB_OUTPUT"
            echo "GIT_SHA=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.component }}" = "frontend" ]; then
            echo "context=./frontend" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./frontend/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        if: env.SHOULD_PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CCR_USERNAME }}
          password: ${{ secrets.CCR_PASSWORD }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/materials-manager
          tags: |
            type=raw,value=${{ matrix.component }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=${{ matrix.component }}-sha-
            type=ref,event=tag,prefix=${{ matrix.component }}-

      - name: 构建并按需推送镜像
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.settings.outputs.context }}
          file: ${{ steps.settings.outputs.dockerfile }}
          build-args: ${{ steps.settings.outputs.build_args }}
          push: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: false
          sbom: false
