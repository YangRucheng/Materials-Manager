name: 契约一致性校验

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: contract-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 校验 openapi / generated.ts 未漂移
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 安装后端依赖
        working-directory: backend
        run: |
          pip install -e ".[dev]" || pip install -e .

      - name: 重新导出 openapi.yaml，校验与后端一致
        working-directory: backend
        run: |
          python scripts/export_openapi.py
          cd ..
          if ! git diff --exit-code docs/openapi.yaml; then
            echo "❌ docs/openapi.yaml 与后端契约不一致。"
            echo "请在 backend 目录运行：python scripts/export_openapi.py 并提交结果。"
            exit 1
          fi
          echo "✅ docs/openapi.yaml 与后端契约一致"

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 重新生成 generated.raw.ts，校验与 openapi.yaml 一致
        working-directory: frontend
        run: |
          npx openapi-typescript ../docs/openapi.yaml -o src/api/generated.raw.ts
          if ! git diff --exit-code src/api/generated.raw.ts; then
            echo "❌ src/api/generated.raw.ts 与 docs/openapi.yaml 不一致。"
            echo "请在 frontend 目录运行：npm run generate:api 并提交结果。"
            exit 1
          fi
          echo "✅ src/api/generated.raw.ts 与 docs/openapi.yaml 一致"

      - name: 类型检查（generated.ts 引用映射是否仍成立）
        working-directory: frontend
        run: npx vue-tsc -b
