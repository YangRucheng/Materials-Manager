name: 契约一致性校验

# openapi.yaml 是唯一契约源。校验：
# 1) Go 后端内嵌副本与 docs/openapi.yaml 一致（契约漂移测试）
# 2) 前端 generated.raw.ts 与 openapi.yaml 一致
on:
  push:
    branches: ["**"]
    paths:
      - "server/**"
      - "docs/**"
      - "frontend/**"
      - ".github/workflows/contract-check.yml"
  pull_request:
    paths:
      - "server/**"
      - "docs/**"
      - "frontend/**"
      - ".github/workflows/contract-check.yml"

permissions:
  contents: read

concurrency:
  group: contract-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 校验 openapi 未漂移
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod

      - name: 安装 libwebp（WebP 预览编码 CGO 依赖）
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev

      - name: 契约漂移测试（内嵌 openapi == docs/openapi.yaml）
        working-directory: server
        run: go test ./test/ -run TestOpenAPIContractDrift -v

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 重新生成 generated.raw.ts，校验与 openapi.yaml 一致
        working-directory: frontend
        run: |
          npx openapi-typescript ../docs/openapi.yaml -o src/api/generated.raw.ts
          if ! git diff --exit-code src/api/generated.raw.ts; then
            echo "❌ src/api/generated.raw.ts 与 docs/openapi.yaml 不一致。"
            echo "请在 frontend 目录运行：npm run generate:api 并提交结果。"
            exit 1
          fi
          echo "✅ src/api/generated.raw.ts 与 docs/openapi.yaml 一致"

      - name: 类型检查（generated.ts 引用映射是否仍成立）
        working-directory: frontend
        run: npx vue-tsc -b
