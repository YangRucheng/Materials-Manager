name: Go 后端测试

# 合并前的 Go 后端单元/集成测试：使用内存 SQLite，无需 MySQL。
on:
  push:
    branches: ["**"]
    paths:
      - "server/**"
      - ".github/workflows/go-test.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/go-test.yml"

permissions:
  contents: read

concurrency:
  group: go-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go 测试（SQLite）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 安装 libwebp（WebP 预览编码依赖）
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev

      - name: gofmt 检查
        working-directory: server
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "以下文件未格式化：$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        working-directory: server
        run: go vet ./...

      - name: 运行测试
        working-directory: server
        run: go test ./...
